# ============================================================
# AcciVision — Hệ Thống Phát Hiện Tai Nạn Giao Thông Thông Minh
# Tệp cấu hình hệ thống (System Configuration)
# ============================================================

project:
  name: "AcciVision - Hệ Thống Phát Hiện Tai Nạn Giao Thông Thông Minh"
  version: "1.0.0"
  description: "Accident Detection System using Computer Vision & Machine Learning"


# ============================================================
# CẤU HÌNH VIDEO ĐẦU VÀO / ĐẦU RA
# ============================================================

video:
  # Đường dẫn video đầu vào (tương đối hoặc tuyệt đối)
  input: "dataset/input_video/traffic.mp4"

  # Đường dẫn video kết quả đầu ra
  output: "outputs/videos/result.mp4"

  # Đường dẫn tệp CSV đặc trưng đầu ra
  features_csv: "dataset/output_features.csv"

  # Hiển thị cửa sổ OpenCV khi chạy CLI
  display: true

  # Lưu video kết quả
  save_output: true

  # Thay đổi kích thước video đầu vào (tăng tốc xử lý)
  resize:
    enabled: true
    width: 960


# ============================================================
# MÔ HÌNH PHÁT HIỆN PHƯƠNG TIỆN (YOLOv8)
# ============================================================

yolo:
  # Đường dẫn mô hình YOLOv8
  # Các lựa chọn: yolov8n.pt (nhanh), yolov8s.pt, yolov8m.pt (chính xác hơn)
  model: "models/yolov8n.pt"

  # Ngưỡng tin cậy phát hiện (confidence threshold)
  confidence: 0.30

  # Ngưỡng IoU cho Non-Maximum Suppression
  iou: 0.50

  # Thiết bị tính toán: "cpu", "cuda", "cuda:0", "mps"
  device: "cpu"

  # Các lớp đối tượng COCO cần phát hiện:
  #   0  = người (person)
  #   1  = xe đạp (bicycle)
  #   2  = ô tô (car)
  #   3  = xe máy (motorcycle)
  #   5  = xe buýt (bus)
  #   7  = xe tải (truck)
  #
  # Hệ thống AcciVision chỉ theo dõi phương tiện giao thông:
  classes:
    - 2   # Ô tô
    - 3   # Xe máy
    - 5   # Xe buýt
    - 6   # Tàu hỏa / xe lóa đèn ban đêm
    - 7   # Xe tải


# ============================================================
# THEO DÕI ĐA ĐỐI TƯỢNG (ByteTrack Tracker)
# ============================================================

tracker:
  # Thuật toán theo dõi
  type: "bytetrack"

  # Tệp cấu hình ByteTrack
  config: "bytetrack.yaml"

  # Số frame tối đa giữ trajectory khi mất phát hiện
  max_missed_frames: 15

  # Số frame lịch sử quỹ đạo tối đa cho mỗi phương tiện
  max_history: 300


# ============================================================
# CHUYỂN ĐỔI PHỐI CẢNH (Perspective Transform → Bird's Eye View)
# ============================================================

perspective:
  # Bật/tắt chuyển đổi phối cảnh
  # Khi tắt: hệ thống sử dụng tọa độ pixel thay vì tọa độ mét thực tế
  enabled: true

  # ----------------------------------------------------------
  # ĐIỂM NGUỒN (Source Points)
  # 4 điểm trên ảnh camera (tọa độ pixel)
  # Thứ tự: trên-trái → trên-phải → dưới-phải → dưới-trái
  # ----------------------------------------------------------
  source_points:
    - [320, 230]
    - [950, 230]
    - [1200, 700]
    - [100, 700]

  # ----------------------------------------------------------
  # ĐIỂM ĐÍCH (Destination Points)
  # Hình chữ nhật Bird's Eye View (tọa độ pixel BEV)
  # ----------------------------------------------------------
  destination_points:
    - [0, 0]
    - [800, 0]
    - [800, 1200]
    - [0, 1200]

  # ----------------------------------------------------------
  # Tỉ lệ chuyển đổi Pixel → Mét
  # ⚠️ GIÁ TRỊ MẪU — Cần calibration theo camera thực tế
  # để đảm bảo tính chính xác của tốc độ và khoảng cách
  # ----------------------------------------------------------
  meters_per_pixel_x: 0.05
  meters_per_pixel_y: 0.05


# ============================================================
# QUẢN LÝ QUỸ ĐẠO & NỘI SUY (Trajectory & Interpolation)
# ============================================================

trajectory:
  # Khoảng trống frame tối đa được phép nội suy
  max_interpolation_gap: 15


# ============================================================
# TRÍCH XUẤT ĐẶC TRƯNG ĐỘNG HỌC (Kinematic Feature Extraction)
# ============================================================

features:
  # Số frame cửa sổ trượt (sliding window) cho thống kê thời gian
  temporal_window: 8

  # Ngưỡng gia tốc giảm tốc tối thiểu để xác định phanh đột ngột (m/s²)
  sudden_stop_deceleration: 4.5

  # Ngưỡng thay đổi hướng tối thiểu để xác định đổi quỹ đạo (độ)
  direction_change_threshold: 45.0

  # Hệ số làm mịn vận tốc EMA (0.25 - 0.35 để lọc triệt để rung lắc bounding box)
  velocity_smoothing_alpha: 0.30


# ============================================================
# MÔ HÌNH PHÂN LOẠI TAI NẠN (Random Forest Classifier)
# ============================================================

classifier:
  # Bật/tắt mô hình phân loại
  enabled: true

  # Đường dẫn mô hình Random Forest đã huấn luyện
  model: "models/accident_rf_model.pkl"

  # Ngưỡng xác suất để quyết định "CÓ TAI NẠN" (ACCIDENT)
  # Khuyến nghị: 0.75 - 0.80 để triệt tiêu báo động giả khi xe lưu thông bình thường
  threshold: 0.75

  # Số frame liên tiếp duy trì trạng thái bất thường để xác nhận sự kiện tai nạn
  # 8 - 12 frames (~0.25s - 0.4s) để lọc bỏ hoàn toàn rung lắc camera / bounding box jitter
  confirmation_frames: 8


# ============================================================
# CẤU HÌNH ĐẦU RA (Output Settings)
# ============================================================

output:
  # Lưu tệp CSV đặc trưng
  save_csv: true

  # Lưu video kết quả
  save_video: true

  # Hiển thị quỹ đạo chuyển động trên video
  draw_trajectory: true

  # Hiển thị tọa độ thực tế (mét) trên video
  draw_world_position: true

  # Hiển thị tốc độ phương tiện trên video
  draw_speed: true

  # Hiển thị FPS xử lý trên video
  draw_fps: true

  # Độ dài quỹ đạo hiển thị (số điểm)
  trajectory_length: 50

# ============================================================
# XÁC THỰC THỊ GIÁC KÉP (Visual Verification - MobileNetV3)
# ============================================================

visual_verification:
  enabled: true
  model: "models/visual_accident_classifier.pth"
  threshold: 0.40

